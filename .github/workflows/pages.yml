name: Publish to GitHub Pages

# Deployment, kept separate from `ci.yml` on purpose.
#
# This workflow needs the repository's Pages source to be set to **GitHub
# Actions** (Settings → Pages). Until an operator sets it, this workflow fails
# and `ci.yml` — which builds the site and runs both checks — still passes, so
# a missing repository setting never looks like a broken build.
#
# The two checks run again here, against the artifact that is about to be
# published rather than against one built earlier in another job. A check that
# passed on a different build of the same commit has not checked what is being
# deployed.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build, check and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: python3 build/build.py --fixtures fixtures --out _site

      - name: provenance-present
        run: python3 build/checks/provenance_present.py --fixtures fixtures --site _site

      - name: disclaimer-verbatim
        run: python3 build/checks/disclaimer_verbatim.py --fixtures fixtures --site _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
